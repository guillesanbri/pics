<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Riddles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.9);
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        .riddles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .riddle-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .riddle-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .riddle-card.solved {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .riddle-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .riddle-card.solved .riddle-number {
            color: white;
        }

        .riddle-title {
            font-size: 1.3em;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .riddle-status {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .qr-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
        }

        .qr-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .qr-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
            background: #f0f0f0;
            border-radius: 10px;
        }

        .qr-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .qr-overlay {
            position: absolute;
            top: 0;
            background: #333;
            transition: all 0.5s ease;
        }

        .qr-overlay-1 {
            left: 0;
            width: 50%;
            height: 50%;
        }

        .qr-overlay-2 {
            right: 0;
            width: 50%;
            height: 50%;
        }

        .qr-overlay-3 {
            left: 0;
            bottom: 0;
            width: 50%;
            height: 50%;
        }

        .qr-overlay-4 {
            right: 0;
            bottom: 0;
            width: 50%;
            height: 50%;
        }

        .qr-overlay.revealed {
            opacity: 0;
            pointer-events: none;
        }

        .progress-text {
            margin-top: 20px;
            font-size: 1.1em;
            color: #667eea;
            font-weight: 600;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .riddle-text {
            font-size: 1.2em;
            margin-bottom: 25px;
            line-height: 1.6;
            color: #333;
            font-style: italic;
        }

        .answer-input {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .answer-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-cancel {
            background: #f0f0f0;
            color: #333;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .feedback.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .feedback.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .riddles-grid {
                grid-template-columns: 1fr;
            }

            .qr-wrapper {
                width: 250px;
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧩 Mystery Riddles</h1>
        <p class="subtitle">Solve all four riddles to reveal the hidden QR code!</p>

        <div class="riddles-grid">
            <div class="riddle-card" data-riddle="1" onclick="openRiddle(1)">
                <div class="riddle-number">1</div>
                <div class="riddle-title">First Riddle</div>
                <div class="riddle-status">Click to solve</div>
            </div>

            <div class="riddle-card" data-riddle="2" onclick="openRiddle(2)">
                <div class="riddle-number">2</div>
                <div class="riddle-title">Second Riddle</div>
                <div class="riddle-status">Click to solve</div>
            </div>

            <div class="riddle-card" data-riddle="3" onclick="openRiddle(3)">
                <div class="riddle-number">3</div>
                <div class="riddle-title">Third Riddle</div>
                <div class="riddle-status">Click to solve</div>
            </div>

            <div class="riddle-card" data-riddle="4" onclick="openRiddle(4)">
                <div class="riddle-number">4</div>
                <div class="riddle-title">Fourth Riddle</div>
                <div class="riddle-status">Click to solve</div>
            </div>
        </div>

        <div class="qr-container">
            <div class="qr-title">Your QR Code</div>
            <div class="qr-wrapper">
                <img src="images/qr-code.png" alt="QR Code" class="qr-image">
                <div class="qr-overlay qr-overlay-1" data-section="1"></div>
                <div class="qr-overlay qr-overlay-2" data-section="2"></div>
                <div class="qr-overlay qr-overlay-3" data-section="3"></div>
                <div class="qr-overlay qr-overlay-4" data-section="4"></div>
            </div>
            <div class="progress-text">Progress: <span id="progress">0</span>/4 riddles solved</div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="riddleModal">
        <div class="modal-content">
            <div class="modal-header" id="modalHeader">Riddle #1</div>
            <div class="riddle-text" id="riddleText"></div>
            <input type="text" class="answer-input" id="answerInput" placeholder="Type your answer here...">
            <div class="button-group">
                <button class="btn btn-submit" onclick="checkAnswer()">Submit Answer</button>
                <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
            <div class="feedback" id="feedback"></div>
        </div>
    </div>

    <script>
        // Riddles and their answers (case-insensitive)
        const riddles = {
            1: {
                text: "I speak without a mouth and hear without ears. I have no body, but I come alive with wind. What am I?",
                answer: "echo"
            },
            2: {
                text: "The more you take, the more you leave behind. What am I?",
                answer: "footsteps"
            },
            3: {
                text: "I have keys but no locks. I have space but no room. You can enter but can't go outside. What am I?",
                answer: "keyboard"
            },
            4: {
                text: "What has hands but cannot clap?",
                answer: "clock"
            }
        };

        let currentRiddle = null;

        // Cookie functions
        function setCookie(name, value, days = 365) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // Initialize the page
        function init() {
            // Check which riddles are already solved
            for (let i = 1; i <= 4; i++) {
                if (getCookie('riddle' + i) === 'solved') {
                    markAsSolved(i);
                    revealQRSection(i);
                }
            }
            updateProgress();
        }

        // Open riddle modal
        function openRiddle(riddleNum) {
            // Check if already solved
            if (getCookie('riddle' + riddleNum) === 'solved') {
                return;
            }

            currentRiddle = riddleNum;
            document.getElementById('modalHeader').textContent = 'Riddle #' + riddleNum;
            document.getElementById('riddleText').textContent = riddles[riddleNum].text;
            document.getElementById('answerInput').value = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('riddleModal').classList.add('active');
            document.getElementById('answerInput').focus();
        }

        // Close modal
        function closeModal() {
            document.getElementById('riddleModal').classList.remove('active');
            currentRiddle = null;
        }

        // Check answer
        function checkAnswer() {
            const userAnswer = document.getElementById('answerInput').value.trim().toLowerCase();
            const correctAnswer = riddles[currentRiddle].answer.toLowerCase();
            const feedback = document.getElementById('feedback');

            if (userAnswer === correctAnswer) {
                feedback.textContent = '🎉 Correct! Well done!';
                feedback.className = 'feedback success';

                // Store in cookie
                setCookie('riddle' + currentRiddle, 'solved');

                // Mark as solved and reveal QR section
                markAsSolved(currentRiddle);
                revealQRSection(currentRiddle);
                updateProgress();

                // Close modal after a short delay
                setTimeout(() => {
                    closeModal();
                }, 1500);
            } else {
                feedback.textContent = '❌ Not quite right. Try again!';
                feedback.className = 'feedback error';
            }
        }

        // Mark riddle card as solved
        function markAsSolved(riddleNum) {
            const card = document.querySelector(`.riddle-card[data-riddle="${riddleNum}"]`);
            card.classList.add('solved');
            card.querySelector('.riddle-status').textContent = '✓ Solved!';
        }

        // Reveal QR code section
        function revealQRSection(riddleNum) {
            const overlay = document.querySelector(`.qr-overlay[data-section="${riddleNum}"]`);
            overlay.classList.add('revealed');
        }

        // Update progress counter
        function updateProgress() {
            let solved = 0;
            for (let i = 1; i <= 4; i++) {
                if (getCookie('riddle' + i) === 'solved') {
                    solved++;
                }
            }
            document.getElementById('progress').textContent = solved;
        }

        // Allow Enter key to submit
        document.addEventListener('DOMContentLoaded', function() {
            init();

            document.getElementById('answerInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkAnswer();
                }
            });

            // Close modal when clicking outside
            document.getElementById('riddleModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
