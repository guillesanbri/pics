<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Riddles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f5dc 0%, #e8dcc4 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .container {
            max-width: 500px;
            width: 100%;
            margin-top: 20px;
        }

        .riddles-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .riddle-card {
            background: #faf8f3;
            border-radius: 15px;
            padding: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .riddle-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .riddle-card.solved {
            background: linear-gradient(135deg, #8b1a1a 0%, #5c0f0f 100%);
            color: #faf8f3;
        }

        .riddle-number {
            font-size: 4em;
            font-weight: bold;
            color: #8b1a1a;
        }

        .riddle-card.solved .riddle-number {
            color: #faf8f3;
        }

        .qr-container {
            background: #faf8f3;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 30px;
        }

        .qr-wrapper {
            position: relative;
            width: 100%;
            max-width: 300px;
            height: 300px;
            margin: 0 auto;
            background: #f5f0e8;
            border-radius: 10px;
        }

        .qr-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .qr-image.visible {
            opacity: 1;
        }

        .progress-text {
            margin-top: 15px;
            font-size: 0.9em;
            color: #8b1a1a;
            font-weight: 600;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #faf8f3;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #8b1a1a;
            font-weight: 600;
        }

        .riddle-text {
            font-size: 1.2em;
            margin-bottom: 25px;
            line-height: 1.6;
            color: #4a4a4a;
            font-style: italic;
        }

        .answer-input {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: 2px solid #e8dcc4;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
            background: #ffffff;
        }

        .answer-input:focus {
            outline: none;
            border-color: #8b1a1a;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: linear-gradient(135deg, #8b1a1a 0%, #5c0f0f 100%);
            color: #faf8f3;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 26, 26, 0.4);
        }

        .btn-cancel {
            background: #e8dcc4;
            color: #4a4a4a;
        }

        .btn-cancel:hover {
            background: #dccfb3;
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .feedback.success {
            background: #e8dcc4;
            color: #5c0f0f;
            display: block;
        }

        .feedback.error {
            background: #f5e6e6;
            color: #8b1a1a;
            display: block;
        }

        @media (max-width: 400px) {
            .riddle-number {
                font-size: 3em;
            }

            .qr-wrapper {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="qr-container">
            <div class="qr-wrapper">
                <img src="images/qr_0.png" alt="QR Code - 0 solved" class="qr-image visible" data-qr="0">
                <img src="images/qr_1.png" alt="QR Code - 1 solved" class="qr-image" data-qr="1">
                <img src="images/qr_2.png" alt="QR Code - 2 solved" class="qr-image" data-qr="2">
                <img src="images/qr_3.png" alt="QR Code - 3 solved" class="qr-image" data-qr="3">
                <img src="images/qr_4.png" alt="QR Code - 4 solved" class="qr-image" data-qr="4">
            </div>
            <div class="progress-text"><span id="progress">0</span>/4</div>
        </div>

        <div class="riddles-grid">
            <div class="riddle-card" data-riddle="1" onclick="openRiddle(1)">
                <div class="riddle-number">1</div>
            </div>

            <div class="riddle-card" data-riddle="2" onclick="openRiddle(2)">
                <div class="riddle-number">2</div>
            </div>

            <div class="riddle-card" data-riddle="3" onclick="openRiddle(3)">
                <div class="riddle-number">3</div>
            </div>

            <div class="riddle-card" data-riddle="4" onclick="openRiddle(4)">
                <div class="riddle-number">4</div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="riddleModal">
        <div class="modal-content">
            <div class="modal-header" id="modalHeader">Riddle #1</div>
            <div class="riddle-text" id="riddleText"></div>
            <input type="text" class="answer-input" id="answerInput" placeholder="Type your answer here...">
            <div class="button-group">
                <button class="btn btn-submit" onclick="checkAnswer()">Submit Answer</button>
                <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
            <div class="feedback" id="feedback"></div>
        </div>
    </div>

    <script>
        // Riddles and their answers (case-insensitive)
        const riddles = {
            1: {
                text: "I speak without a mouth and hear without ears. I have no body, but I come alive with wind. What am I?",
                answers: ["echo", "an echo"]
            },
            2: {
                text: "The more you take, the more you leave behind. What am I?",
                answers: ["footsteps", "steps", "footprints"]
            },
            3: {
                text: "I have keys but no locks. I have space but no room. You can enter but can't go outside. What am I?",
                answers: ["keyboard", "a keyboard"]
            },
            4: {
                text: "What has hands but cannot clap?",
                answers: ["clock", "a clock", "watch", "a watch"]
            }
        };

        let currentRiddle = null;

        // Cookie functions
        function setCookie(name, value, days = 365) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // Initialize the page
        function init() {
            // Check which riddles are already solved
            for (let i = 1; i <= 4; i++) {
                if (getCookie('riddle' + i) === 'solved') {
                    markAsSolved(i);
                }
            }
            updateProgress();
        }

        // Open riddle modal
        function openRiddle(riddleNum) {
            // Check if already solved
            if (getCookie('riddle' + riddleNum) === 'solved') {
                return;
            }

            currentRiddle = riddleNum;
            document.getElementById('modalHeader').textContent = 'Riddle #' + riddleNum;
            document.getElementById('riddleText').textContent = riddles[riddleNum].text;
            document.getElementById('answerInput').value = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('riddleModal').classList.add('active');
            document.getElementById('answerInput').focus();
        }

        // Close modal
        function closeModal() {
            document.getElementById('riddleModal').classList.remove('active');
            currentRiddle = null;
        }

        // Check answer
        function checkAnswer() {
            const userAnswer = document.getElementById('answerInput').value.trim().toLowerCase();
            const correctAnswers = riddles[currentRiddle].answers.map(a => a.toLowerCase());
            const feedback = document.getElementById('feedback');

            if (correctAnswers.includes(userAnswer)) {
                feedback.textContent = '🎉 Correct! Well done!';
                feedback.className = 'feedback success';

                // Store in cookie
                setCookie('riddle' + currentRiddle, 'solved');

                // Mark as solved and update progress
                markAsSolved(currentRiddle);
                updateProgress();

                // Close modal after a short delay
                setTimeout(() => {
                    closeModal();
                }, 1500);
            } else {
                feedback.textContent = '❌ Not quite right. Try again!';
                feedback.className = 'feedback error';
            }
        }

        // Mark riddle card as solved
        function markAsSolved(riddleNum) {
            const card = document.querySelector(`.riddle-card[data-riddle="${riddleNum}"]`);
            card.classList.add('solved');
        }

        // Update QR image based on progress
        function updateQRImage() {
            // Count solved riddles
            let solved = 0;
            for (let i = 1; i <= 4; i++) {
                if (getCookie('riddle' + i) === 'solved') {
                    solved++;
                }
            }

            // Hide all QR images
            document.querySelectorAll('.qr-image').forEach(img => {
                img.classList.remove('visible');
            });

            // Show the appropriate QR image (0 to 4)
            const qrImage = document.querySelector(`.qr-image[data-qr="${solved}"]`);
            if (qrImage) {
                qrImage.classList.add('visible');
            }
        }

        // Update progress counter
        function updateProgress() {
            let solved = 0;
            for (let i = 1; i <= 4; i++) {
                if (getCookie('riddle' + i) === 'solved') {
                    solved++;
                }
            }
            document.getElementById('progress').textContent = solved;
            updateQRImage();
        }

        // Allow Enter key to submit
        document.addEventListener('DOMContentLoaded', function() {
            init();

            document.getElementById('answerInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkAnswer();
                }
            });

            // Close modal when clicking outside
            document.getElementById('riddleModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
